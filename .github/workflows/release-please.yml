# Keeps a release PR open with the next version and CHANGELOG.md; merging it tags and publishes a GitHub Release.
# When only hidden types (ci, chore, …) landed, it leaves the PR as is; "Update branch" on the PR re-runs its CI.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
