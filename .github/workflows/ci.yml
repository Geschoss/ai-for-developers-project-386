# Project checks. hexlet-check.yml is Hexlet's and stays untouched.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  # actions/cache saves the pnpm store from a post-step.
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Node version in the Dockerfile matches mise.toml
        run: |
          set -euo pipefail
          mise_node="$(sed -n 's/^node = "\([^"]*\)"/\1/p' mise.toml)"
          if [[ -z "${mise_node}" ]]; then
            echo "mise.toml has no node version" >&2
            exit 1
          fi
          found=0
          while IFS= read -r tag; do
            found=1
            version="${tag%%@*}"
            version="${version%%-*}"
            if [[ "${version}" != "${mise_node}" ]]; then
              echo "Dockerfile has node:${tag}, mise.toml has ${mise_node}" >&2
              exit 1
            fi
          done < <(sed -n 's/^FROM node:\([^[:space:]]*\).*/\1/p' Dockerfile)
          if [[ "${found}" -eq 0 ]]; then
            echo "Dockerfile has no FROM node:" >&2
            exit 1
          fi
          echo "Node ${mise_node} matches the Dockerfile"

      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@v5

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: oxlint
        run: mise run lint

      - name: oxfmt
        run: mise run format

      - name: typecheck
        run: mise run typecheck

      - name: knip
        run: mise run knip

      - name: dependency-cruiser
        run: mise run depcruise

      - name: spec/openapi.yaml matches TypeSpec
        run: pnpm spec:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e
