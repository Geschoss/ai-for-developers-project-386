# Blueprint for the public app. Secret values are entered in the Render dashboard and stay out of git.
# https://render.com/docs/blueprint-spec
databases:
  - name: calendar-386-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    # The app uses the private connection string. No public ingress.
    ipAllowList: []

services:
  - type: web
    name: calendar-386
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    # Deploy a push to main only after every GitHub check on that commit passes.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-386-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
