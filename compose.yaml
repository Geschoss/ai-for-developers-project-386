services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "calendar"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://calendar:calendar@db:5432/calendar
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
